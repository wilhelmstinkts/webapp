name: Code Quality Assurance

on: [push]

jobs:
  html5-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout head
        uses: actions/checkout@v2
      - name: HTML5 Validator
        uses: Cyb3r-Jak3/html5validator-action@v0.4.4
        with:
          root: ./src
          css: true
